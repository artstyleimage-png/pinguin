# Builds the Unity game PLANT RACCOON for the browser on every push that touches it,
# and publishes it to GitHub Pages: https://artstyleimage-png.github.io/pinguin/plant-raccoon/
#
# One-time setup (repository Settings):
#   1. Secrets and variables > Actions > New repository secret:
#        UNITY_EMAIL     - your Unity account e-mail
#        UNITY_PASSWORD  - your Unity account password
#        UNITY_LICENSE   - full contents of your Unity_lic.ulf file (see PlantRaccoon/PLAY_ONLINE.md)
#   2. After the first successful run: Pages > Source "Deploy from a branch" > gh-pages / (root).
name: PLANT RACCOON WebGL

on:
  push:
    paths:
      - 'PlantRaccoon/**'
      - '.github/workflows/plant-raccoon-webgl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plant-raccoon-webgl
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See PlantRaccoon/PLAY_ONLINE.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/cache@v4
        with:
          path: PlantRaccoon/Library
          key: Library-PlantRaccoon-WebGL-${{ hashFiles('PlantRaccoon/Packages/manifest.json', 'PlantRaccoon/Assets/**/*.cs') }}
          restore-keys: |
            Library-PlantRaccoon-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: PlantRaccoon
          unityVersion: 6000.0.84f1
          targetPlatform: WebGL
          buildName: PlantRaccoon
          buildMethod: PlantRaccoon.EditorTools.PlantRaccoonBuild.BuildWebGL
          versioning: None
          allowDirtyBuild: true

      - name: Keep a downloadable copy
        uses: actions/upload-artifact@v4
        with:
          name: PlantRaccoon-WebGL
          path: build/WebGL/PlantRaccoon
          retention-days: 14

      - name: Publish to GitHub Pages (gh-pages branch, plant-raccoon folder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/WebGL/PlantRaccoon
          destination_dir: plant-raccoon
          keep_files: true
          commit_message: "Publish PLANT RACCOON WebGL build"
